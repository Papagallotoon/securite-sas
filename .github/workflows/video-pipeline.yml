name: Video pipeline

on:
  schedule:
    # 9h, 14h and 19h heure de Paris (currently UTC+2, CEST) = 7h, 12h, 17h
    # UTC. cron is always UTC — when France switches back to UTC+1 in late
    # October, bump all three by 1 hour (8h/13h/18h UTC) to keep the same
    # local times.
    - cron: "0 7 * * *"
    - cron: "0 12 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      force_article_slug:
        description: "Redo one specific article's video (slug) instead of the next unused one"
        required: false
        type: string

permissions:
  contents: write

# Le cron GitHub natif et le declenchement redondant cron-job.org peuvent
# tirer au meme instant (les deux ciblent 7h/12h/17h UTC) ; sans ce verrou,
# les deux runs lisent state.json avant que l'un des deux ne l'ait commite
# et selectionnent/publient le meme article en double. cancel-in-progress:
# false fait attendre le second run plutot que de l'annuler, pour ne pas
# risquer d'interrompre un upload deja lance.
concurrency:
  group: video-pipeline
  cancel-in-progress: false

jobs:
  make-and-publish-short:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - run: npm ci

      - name: Generate and upload short
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FORCE_ARTICLE_SLUG: ${{ inputs.force_article_slug }}
        run: node video-pipeline/run.mjs

      - name: Commit updated state
        run: |
          git config user.name "video-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add video-pipeline/state.json
          git diff --cached --quiet || git commit -m "chore: video pipeline state update"
          git push
